<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | FontSVG</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .box {
      background: #ffffff;
      padding: 3rem 2.5rem;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      max-width: 440px;
      margin: 1.5rem;
    }
    h1 {
      font-size: 4rem;
      margin: 0 0 0.5rem;
      color: #3b82f6;
      font-weight: 800;
      letter-spacing: -0.05em;
    }
    h2 {
      font-size: 1.25rem;
      margin: 0 0 1rem;
      font-weight: 700;
    }
    p {
      color: #6b7280;
      font-size: 0.9375rem;
      line-height: 1.5;
      margin: 0 0 1.75rem;
    }
    a {
      display: inline-block;
      background: #111827;
      color: #ffffff;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    a:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for doesn't exist or has moved. Return to the homepage to vectorize your fonts.</p>
    <a href="/">Back to FontSVG Home &rarr;</a>
  </div>
</body>
</html>
